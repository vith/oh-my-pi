# Woodpecker CI for the self-hosted Forgejo mirror
# (https://git.n3t.work/vith/oh-my-pi, runs on the n3t.work ARM box).
#
# Checks only: lint + typecheck on pushes to integration and on pull
# requests. No release builds, no native addon builds, no test buckets —
# those need platform-specific native addons and stay local / on GitHub CI.
# The shared runner executes one workflow at a time across all repositories.
# Mount this repo's cache per step; trusted volumes and fork approval are required.
labels:
  platform: linux/arm64

steps:
  lint:
    image: oven/bun:1.4.2
    volumes:
      - /var/lib/woodpecker-runner/omp-cache/pr:/ci-cache
    environment:
      BUN_INSTALL_CACHE_DIR: /ci-cache/bun
    commands:
      - bun install --frozen-lockfile
      - bun run check:tools
    when:
      - event: [push, pull_request]
        branch: integration

  types:
    image: oven/bun:1.4.2
    volumes:
      - /var/lib/woodpecker-runner/omp-cache/pr:/ci-cache
    environment:
      BUN_INSTALL_CACHE_DIR: /ci-cache/bun
    depends_on: [lint]
    commands:
      - bun install --frozen-lockfile
      - bun run ci:check:full
    when:
      - event: [push, pull_request]
        branch: integration
