# Native Linux ARM64 CI for the self-hosted Forgejo mirror.
# One shared agent serializes all repos; this job mounts only the OMP cache.
# Trusted volumes are enabled for this private repo; fork PRs require approval.
# Fork versions require the upstream tag and complete commit ancestry.
clone:
  git:
    image: woodpeckerci/plugin-git
    settings:
      tags: true
      partial: false
      depth: 0

labels:
  platform: linux/arm64

steps:
  native-ci:
    image: localhost/omp-ci:arm64
    volumes:
      - /var/lib/woodpecker-runner/omp-cache/pr:/ci-cache
      # A separate mount lets APT's sandbox user traverse its cache without
      # making the private compiler/dependency cache readable to that user.
      - /var/lib/woodpecker-runner/omp-cache/pr/apt:/apt-cache
    environment:
      BUN_INSTALL_CACHE_DIR: /ci-cache/bun
      BUN_RUNTIME_TRANSPILER_CACHE_PATH: /ci-cache/bun-transpiler
      XDG_CACHE_HOME: /ci-cache/xdg
      CARGO_HOME: /ci-cache/cargo
      CARGO_TARGET_DIR: /ci-cache/target
      LIBCLANG_PATH: /usr/lib/llvm-19/lib
      RUSTUP_HOME: /opt/rustup
    commands:
      - |
        set -eu
        export PATH="/opt/cargo/bin:$PATH"

        test "$(uname -m)" = aarch64
        test "$(bun -e 'console.log(process.arch)')" = arm64
        test "$(rustc -vV | sed -n 's/^host: //p')" = aarch64-unknown-linux-gnu
        case "$(cc -dumpmachine)" in
          aarch64*-linux-gnu) ;;
          *) echo "cc must target aarch64 Linux" >&2; exit 1 ;;
        esac
        test -z "${CARGO_BUILD_TARGET:-}"
        test -z "${CROSS_TARGET:-}"

        # Exercise the fork's optional portal capture implementation, not only
        # the default build that compiles it out.
        mkdir -p /apt-cache/archives/partial /apt-cache/lists/partial
        apt-get -o Dir::State::lists=/apt-cache/lists -o Dir::Cache::archives=/apt-cache/archives update
        DEBIAN_FRONTEND=noninteractive apt-get \
          -o Dir::State::lists=/apt-cache/lists \
          -o Dir::Cache::archives=/apt-cache/archives \
          -o APT::Keep-Downloaded-Packages=true \
          install -y --no-install-recommends libpipewire-0.3-dev libclang1-19 libclang-common-19-dev openssh-client rsync

        # Fresh git checkouts otherwise invalidate Cargo's mtime fingerprints.
        # Content synchronization preserves unchanged sources and dependency trees.
        workspace="$(bash scripts/ci-prepare-workspace.sh "$PWD" /ci-cache/workspace)"
        cd "$workspace"

        bun install --frozen-lockfile
        # Test execution is temporarily disabled until its CI cost is optimized.
        # Keep lint/format/type checks and verify the actual shipping version.
        bun run check:ts
        bun run check:rs
        bun run collab:web:build
        # Stamp only disposable build inputs; keep the checked-in upstream versions.
        fork_version="$(bun scripts/prepare-fork-build.ts)"
        OMP_NATIVE_BUILD_BACKEND=cargo OMP_NATIVE_CARGO_PROFILE=ci OMP_NATIVE_PIPEWIRE=1 bun run build:native
        bun --cwd=packages/coding-agent run build
        test "$(packages/coding-agent/dist/omp --version)" = "omp/$fork_version"
    when:
      - event: [push, pull_request]
        branch: integration
