name: Dispatch trusted fork PR validation
on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited]
    branches: [integration]
permissions:
  contents: read
  pull-requests: read
  actions: write
jobs:
  dispatch:
    if: github.event.pull_request.base.ref == 'integration'
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Dispatch by numeric metadata only (no checkout)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          with open(os.environ['GITHUB_EVENT_PATH']) as source:
              event = json.load(source)
          number = event['pull_request']['number']
          if type(number) is not int or number < 1:
              raise ValueError('invalid PR number')
          if event['pull_request']['base']['repo']['full_name'] != os.environ['GITHUB_REPOSITORY']:
              raise ValueError('invalid base repository')
          body = {'ref':'integration','inputs':{'pr_number':str(number)}}
          request = urllib.request.Request('https://api.github.com/repos/' + os.environ['GITHUB_REPOSITORY'] + '/actions/workflows/fork-ci.yml/dispatches', data=json.dumps(body).encode(), headers={'Authorization':'Bearer '+os.environ['GITHUB_TOKEN'],'Accept':'application/vnd.github+json'})
          with urllib.request.urlopen(request) as response:
              assert response.status == 204
          PY
